services:
  - type: web
    name: proyecto-formulario-sso
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: "gunicorn --bind 0.0.0.0:$PORT wsgi:app"
    healthCheckPath: /healthz
    envVars:
      - key: RENDER
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true