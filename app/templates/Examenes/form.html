{% extends 'base.html' %}

{% block content %}

<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Registro de examen</h2>
        <a href="{% if empleado %}{{ url_for('empleado.consulta_integral', id=empleado.id_empleado) }}{% else %}{{ url_for('examen.listar') }}{% endif %}" class="btn btn-secondary">Volver</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="POST" enctype="multipart/form-data">
                {% include 'examenes/_hco_modules.html' %}
                <input type="hidden" name="tipo_novedad" value="pre_ingreso">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Fecha de novedad</label>
                        <input type="date" name="fecha_novedad" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Estado</label>
                        <select name="estado_novedad" class="form-select">
                            <option value="pendiente">Pendiente</option>
                            <option value="en_proceso">En proceso</option>
                            <option value="finalizado">Finalizado</option>
                        </select>
                    </div>

                    <div class="col-12" id="sv_section" style="display:none;">
                        <label class="form-label">Riesgos (seleccione uno o varios)</label>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="riesgo[]" value="quimico" id="riesgo_quimico">
                            <label class="form-check-label" for="riesgo_quimico">Químico</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="riesgo[]" value="psicosocial" id="riesgo_psicosocial">
                            <label class="form-check-label" for="riesgo_psicosocial">Psicosocial</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="riesgo[]" value="ruido" id="riesgo_ruido">
                            <label class="form-check-label" for="riesgo_ruido">Ruido</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="riesgo[]" value="visual" id="riesgo_visual">
                            <label class="form-check-label" for="riesgo_visual">Visual</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="riesgo[]" value="biomecanico" id="riesgo_biomecanico">
                            <label class="form-check-label" for="riesgo_biomecanico">Biomecánico</label>
                        </div>
                    </div>

                    <div class="col-12" id="eps_section" style="display:none;">
                        <label class="form-label">Especialidad solicitada</label>
                        <select name="especialidad_eps" class="form-select">
                            <option value="">-- Seleccione especialidad --</option>
                            <option value="medicina_general">Medicina General</option>
                            <option value="medicina_ocupacional">Medicina Ocupacional</option>
                            <option value="otorrino">Otorrinolaringología</option>
                            <option value="oftalmologia">Oftalmología</option>
                            <option value="psicologia">Psicología</option>
                        </select>

                        <label class="form-label mt-2">Adjuntar documento (PDF)</label>
                        <input type="file" name="pdf_eps" accept="application/pdf" class="form-control">

                        <label class="form-label mt-2">Observaciones EPS</label>
                        <textarea name="observaciones_eps" class="form-control" rows="3"></textarea>
                    </div>

                    <div class="col-12" id="otro_section" style="display:none;">
                        <label class="form-label">Descripción de la novedad</label>
                        <textarea name="descripcion_otro" class="form-control" rows="3"></textarea>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Observaciones generales</label>
                        <textarea name="observaciones" class="form-control" rows="4"></textarea>
                    </div>

                    <div class="col-12">
                        <hr>
                        <h6 class="mt-3 mb-3 text-primary"><strong>Concepto Médico Ocupacional</strong></h6>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Fecha del examen</label>
                        <input type="date" name="fecha_examen" class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Concepto de Aptitud</label>
                        <select name="concepto_de_aptitud" class="form-select">
                            <option value="">-- Seleccione --</option>
                            <option value="apto">Apto</option>
                            <option value="apto_con_restricciones">Apto con restricciones</option>
                            <option value="no_apto">No apto</option>
                            <option value="pendiente">Pendiente resultado</option>
                        </select>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Restricciones Médicas</label>
                        <textarea name="restricciones_medicas" class="form-control" rows="3" placeholder="Ejemplo: No levantar más de 10 kg, evitar exposición al sol..."></textarea>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Recomendaciones Médicas</label>
                        <textarea name="recomendaciones_medicas" class="form-control" rows="3" placeholder="Ejemplo: Usar protección auditiva, asistir a fonoaudiología..."></textarea>
                    </div>
                </div>

                <div class="mt-4 text-end">
                    <button type="submit" class="btn btn-primary">Guardar Novedad</button>
                </div>
            </form>
        </div>
    </div>

</div>

<script>
document.addEventListener('DOMContentLoaded', function(){
    const tipo = document.getElementById('tipo_novedad');
    const sv = document.getElementById('sv_section');
    const eps = document.getElementById('eps_section');
    const otro = document.getElementById('otro_section');
    const periodico = document.getElementById('periodico_section');
    const tipoExamenSection = document.getElementById('tipo_examen_section');

    function updateVisibility(){
        const val = tipo.value;
        sv.style.display = (val === 'sistema_vigilancia') ? 'block' : 'none';
        eps.style.display = (val === 'solicitado_eps') ? 'block' : 'none';
        otro.style.display = (val === 'otro') ? 'block' : 'none';
        if (periodico) {
            periodico.style.display = (val === 'periodico_ocupacional') ? 'block' : 'none';
        }
        if (tipoExamenSection) {
            tipoExamenSection.hidden = val === 'pre_ingreso';
        }
    }

    if(tipo){
        tipo.addEventListener('change', updateVisibility);
        updateVisibility();
    }

    // Chat button placeholder action
    const chatBtn = document.getElementById('chat_btn');
    if(chatBtn){
        chatBtn.addEventListener('click', function(){
            alert('Abrir chat para seguimiento del examen periódico ocupacional');
        });
    }
});
</script>

{% endblock %}
