{% extends 'base.html' %}

{% block content %}

<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">
        {% if is_edit %}
        <div>
            <h4 class="mb-0">Editar Examen Ocupacional</h4>
            <p class="text-muted mb-0">Modifique la información del examen y guarde los cambios.</p>
        </div>
        <a href="{{ url_for('examen.detalle', id=examen.id) }}" class="btn btn-outline-secondary">Cancelar</a>
        {% endif %}
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="POST" enctype="multipart/form-data">
                <h4 class="text-primary fw-bold mb-3" id="tituloFormulario">Valoración ocupacional laboral</h4>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Tipo de examen</label>
                        <select name="tipo_examen" id="tipo_examen" class="form-select" required>
                            <option value="">-- Seleccione --</option>
                            <option value="pre_ingreso">Examen de pre-ingreso</option>
                            <option value="periodico_ocupacional">Examen periódico</option>
                            <option value="cambio_ocupacion">Examen por cambio de ocupación</option>
                            <option value="egreso">Examen de egreso</option>
                            <option value="post_incapacidad">Examen de post-incapacidad</option>
                            <option value="retorno_laboral">Examen de retorno laboral</option>
                            <option value="seguimiento">Examen de seguimiento</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Tipo de valoración</label>
                        <select name="tipo_valoracion" id="tipo_valoracion" class="form-select" required>
                            <option value="">-- Seleccione --</option>
                            <option value="valoracion_ocupacional">Valoración ocupacional</option>
                            <option value="valoracion_psicosocial">Valoración por Psicología</option>
                            <option value="terapia_ocupacional">Valoración por Terapia Ocupacional</option>
                            <option value="fisioterapia">Valoración por Fisioterapia Ocupacional</option>
                        </select>
                    </div>
                </div>
                {% include 'examenes/_hco_modules.html' %}
                <div class="mt-4 text-end">
                    <button type="submit" class="btn btn-primary">{{ 'Actualizar' if is_edit else 'Guardar' }}</button>
                </div>

            </form>
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', function(){
    const tipoExamenSelect = document.getElementById('tipo_examen');
    const tipoValoracionSelect = document.getElementById('tipo_valoracion');
    const tituloFormulario = document.getElementById('tituloFormulario');
    const tituloBase = 'Valoración ocupacional laboral';
    const panelMap = {
        valoracion_ocupacional: ['med'],
        valoracion_psicosocial: ['psic'],
        terapia_ocupacional: ['to'],
        fisioterapia: ['fis']
    };

    // Prellenado genérico de campos cuando se edita un examen existente.
    // Recorre cada clave del objeto recibido (nombre del "name" del campo)
    // y asigna su valor al/los elemento(s) correspondientes del formulario,
    // soportando texto, selects, checkboxes, radios y listas de valores.
    function prefillFormData(data) {
        Object.keys(data).forEach(function (name) {
            const value = data[name];
            const elements = document.getElementsByName(name);
            if (!elements || !elements.length) return;

            if (Array.isArray(value)) {
                Array.prototype.forEach.call(elements, function (el) {
                    if (el.type === 'checkbox' || el.type === 'radio') {
                        el.checked = value.map(String).includes(el.value);
                    } else if (el.tagName === 'SELECT' && el.multiple) {
                        Array.prototype.forEach.call(el.options, function (opt) {
                            opt.selected = value.map(String).includes(opt.value);
                        });
                    } else {
                        el.value = value.join(', ');
                    }
                });
                return;
            }

            Array.prototype.forEach.call(elements, function (el) {
                if (el.type === 'checkbox') {
                    el.checked = String(value) === el.value || (el.value === 'on' && !!value);
                } else if (el.type === 'radio') {
                    el.checked = el.value === String(value);
                } else {
                    el.value = value;
                }
            });
        });
    }

    {% if prefill_json %}
    prefillFormData({{ prefill_json | safe }});
    {% endif %}

    function updateTipoValoracion() {
        const selectedType = tipoValoracionSelect ? tipoValoracionSelect.value : '';
        const modulesToShow = new Set(panelMap[selectedType] || []);
        document.querySelectorAll('.hco-panel').forEach(function (panel) {
            panel.classList.toggle('d-none', !modulesToShow.has(panel.dataset.hcoModule));
        });
    }

    function updateTitulo() {
        if (!tituloFormulario) return;
        const examenTexto = tipoExamenSelect && tipoExamenSelect.selectedIndex > 0
            ? tipoExamenSelect.options[tipoExamenSelect.selectedIndex].text
            : '';
        const valoracionTexto = tipoValoracionSelect && tipoValoracionSelect.selectedIndex > 0
            ? tipoValoracionSelect.options[tipoValoracionSelect.selectedIndex].text
            : '';
        const partes = [examenTexto, valoracionTexto].filter(Boolean);
        tituloFormulario.textContent = partes.length ? partes.join(' - ') : tituloBase;
    }

    if (tipoValoracionSelect) {
        tipoValoracionSelect.addEventListener('change', function () {
            updateTipoValoracion();
            updateTitulo();
        });
        updateTipoValoracion();
    }

    if (tipoExamenSelect) {
        tipoExamenSelect.addEventListener('change', updateTitulo);
    }

    updateTitulo();

    const form = document.querySelector('form[method="POST"]');
    if (form) {
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        form.addEventListener('submit', function (event) {
            if (!tipoExamenSelect.value || !tipoValoracionSelect.value) {
                event.preventDefault();
                alert('Debe seleccionar el tipo de examen y el tipo de valoración.');
                return;
            }

            const camposCorreo = form.querySelectorAll('input[type="email"]');
            for (const campo of camposCorreo) {
                const valor = campo.value.trim();
                if (valor && !emailPattern.test(valor)) {
                    event.preventDefault();
                    const etiqueta = campo.closest('.col-md-3, .col-md-4, .col-md-6, .col-md-12, .col-12')
                        ? campo.closest('.col-md-3, .col-md-4, .col-md-6, .col-md-12, .col-12').querySelector('label')
                        : null;
                    const nombreCampo = etiqueta ? etiqueta.textContent : 'correo electrónico';
                    alert('El campo "' + nombreCampo + '" debe contener un correo electrónico válido (ejemplo: usuario@dominio.com).');
                    campo.focus();
                    return;
                }
            }
        });
    }

});
</script>

</div>

{% endblock %}
