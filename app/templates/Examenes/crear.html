{% extends 'base.html' %}

{% block content %}

<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">
        
       
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="POST" enctype="multipart/form-data">
                {% include 'examenes/_hco_modules.html' %}
                <div class="row g-3">
                    <div class="col-md-6" id="tipo_examen_section">
                        <label class="form-label">Tipo de examen</label>
                        <select name="tipo_novedad" id="tipo_novedad" class="form-select" required>
                            <option value="">-- Seleccione --</option>
                            <option value="periodico_ocupacional">Examen periódico ocupacional</option>
                            <option value="pre_ingreso">Examen de pre-ingreso</option>
                            <option value="ingreso">Examen de ingreso</option>
                            <option value="egreso">Examen de egreso</option>
                            <option value="reintegro">Reintegro</option>
                            <option value="retorno_laboral">Retorno laboral</option>
                            <option value="post_incapacidad">Post incapacidad</option>
                            <option value="cambio_cargo">Cambio de cargo</option>
                            <option value="sistema_vigilancia">Sistema de vigilancia epidemiológica (examen)</option>
                            <option value="valoracion_psicosocial">Valoración de psicología ocupacional</option>
                            <option value="terapia_ocupacional">Valoración de terapia ocupacional</option>
                            <option value="fisioterapia">Valoración de fisioterapia ocupacional</option>
                            <option value="certificacion_alto_riesgo">Certificación de actividad de alto riesgo</option>
                            <option value="integrador_multidisciplinario">Concepto multidisciplinario integrador</option>
                            <option value="solicitado_eps">Solicitado por la EPS</option>
                            <option value="otro">Otro</option>
                        </select>
                    </div>

                    <div class="col-12" id="sv_section" style="display:none;">
                        <label class="form-label">Riesgos (seleccione uno o varios)</label>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="riesgo[]" value="quimico" id="riesgo_quimico">
                            <label class="form-check-label" for="riesgo_quimico">Químico</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="riesgo[]" value="psicosocial" id="riesgo_psicosocial">
                            <label class="form-check-label" for="riesgo_psicosocial">Psicosocial</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="riesgo[]" value="ruido" id="riesgo_ruido">
                            <label class="form-check-label" for="riesgo_ruido">Ruido</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="riesgo[]" value="visual" id="riesgo_visual">
                            <label class="form-check-label" for="riesgo_visual">Visual</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="riesgo[]" value="biomecanico" id="riesgo_biomecanico">
                            <label class="form-check-label" for="riesgo_biomecanico">Biomecánico</label>
                        </div>
                    </div>

                    <div class="col-12" id="eps_section" style="display:none;">
                        <label class="form-label">Especialidad solicitada</label>
                        <select name="especialidad_eps" class="form-select">
                            <option value="">-- Seleccione especialidad --</option>
                            <option value="medicina_general">Medicina General</option>
                            <option value="medicina_ocupacional">Medicina Ocupacional</option>
                            <option value="otorrino">Otorrinolaringología</option>
                            <option value="oftalmologia">Oftalmología</option>
                            <option value="psicologia">Psicología</option>
                        </select>

                        <label class="form-label mt-2">Adjuntar documento (PDF)</label>
                        <input type="file" name="pdf_eps" accept="application/pdf" class="form-control">

                        <label class="form-label mt-2">Observaciones EPS</label>
                        <textarea name="observaciones_eps" class="form-control" rows="3"></textarea>
                    </div>

                    <div class="col-12" id="otro_section" style="display:none;">
                        <label class="form-label">Descripción de la novedad</label>
                        <textarea name="descripcion_otro" class="form-control" rows="3"></textarea>
                    </div>

                    <div class="col-12" id="periodico_section" style="display:none;">

    <hr>

    <h5 class="text-primary">
        Concepto Médico Ocupacional
    </h5>

    <div class="row mt-3">

    <div class="col-md-6">

        <label class="form-label">
            Fecha del examen
        </label>

        <input
            type="date"
            name="fecha_examen"
            class="form-control">

    </div>

</div>

    <div class="row">

        <div class="col-md-6">

            <label class="form-label">
                Concepto de Aptitud
            </label>

            <select
                name="concepto_de_aptitud"
                class="form-select">

                <option value="">-- Seleccione --</option>
                <option value="apto">Apto</option>
                <option value="apto_con_restricciones">
                    Apto con restricciones
                </option>
                <option value="no_apto">
                    No apto
                </option>

            </select>

        </div>

    </div>

    <div class="mt-3">

        <label class="form-label">
            Restricciones Médicas
        </label>

        <textarea
            name="restricciones_medicas"
            class="form-control"
            rows="3"></textarea>

    </div>

    <div class="mt-3">

        <label class="form-label">
            Recomendaciones Médicas
        </label>

        <textarea
            name="recomendaciones_medicas"
            class="form-control"
            rows="3"></textarea>

    </div>

    <div class="row mt-3">

        <div class="col-md-6">

            <label class="form-label">
                IPS Proveedora
            </label>

            <input
                type="text"
                name="ips"
                class="form-control">

        </div>

        <div class="col-md-6">

            <label class="form-label">
                Médico Evaluador
            </label>

            <input
                type="text"
                name="medico"
                class="form-control">

        </div>

    </div>

    <div class="mt-3">

        <label class="form-label">
            Adjuntar Concepto Médico (PDF)
        </label>

        <input
            type="file"
            name="concepto_pdf"
            class="form-control"
            accept=".pdf">

    </div>

</div>
                   
                
                <div class="mt-4 text-end">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>

            </form>
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', function(){
    const tipo = document.getElementById('tipo_novedad');
    const sv = document.getElementById('sv_section');
    const eps = document.getElementById('eps_section');
    const otro = document.getElementById('otro_section');
   const periodico = document.getElementById('periodico_section');
    const tipoExamenSection = document.getElementById('tipo_examen_section');


    function updateVisibility(){
        const val = tipo.value;
        sv.style.display = (val === 'sistema_vigilancia') ? 'block' : 'none';
        eps.style.display = (val === 'solicitado_eps') ? 'block' : 'none';
        otro.style.display = (val === 'otro') ? 'block' : 'none';
        periodico.style.display = (val === 'periodico_ocupacional') ? 'block' : 'none';
        tipoExamenSection.hidden = val !== '';
    }

    if(tipo){
        tipo.addEventListener('change', updateVisibility);
        updateVisibility();
    }

    const chatBtn = document.getElementById('chat_btn');
    if(chatBtn){
        chatBtn.addEventListener('click', function(){
            alert('Abrir chat para seguimiento del examen periódico ocupacional');
        });
    }
});
</script>

</div>

{% endblock %}
