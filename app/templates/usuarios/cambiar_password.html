{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Cambiar Contraseña: {{ usuario.username }}</h2>
        <a href="{{ url_for('usuarios.listar') }}" class="btn btn-secondary">Volver</a>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Contraseña nueva</label>
                        <input type="password" name="password" class="form-control" required placeholder="Nueva contraseña">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Confirmar contraseña</label>
                        <input type="password" name="confirm_password" class="form-control" required placeholder="Repite la contraseña">
                    </div>

                    <div class="col-12">
                        <button type="submit" class="btn btn-primary">Guardar contraseña</button>
                        <a href="{{ url_for('usuarios.listar') }}" class="btn btn-secondary ms-2">Cancelar</a>
                    </div>
                </div>
            </form>
        </div>
    </div>

</div>
{% endblock %}
