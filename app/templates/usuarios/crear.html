{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Crear Nuevo Usuario</h2>
        <a href="{{ url_for('usuarios.listar') }}" class="btn btn-secondary">Volver</a>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ 'danger' if category == 'error' else 'warning' }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Usuario</label>
                        <input type="text" name="username" class="form-control" required placeholder="nombre_usuario">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required placeholder="usuario@ejemplo.com">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Rol</label>
                        <select name="rol" class="form-select" required>
                            <option value="">-- Seleccione --</option>
                            <option value="admin">Administrador</option>
                            <option value="auxiliar" selected>Auxiliar</option>
                            <option value="medico">Médico</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="password" class="form-control" required placeholder="Contraseña segura">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Confirmar contraseña</label>
                        <input type="password" name="confirm_password" class="form-control" required placeholder="Repite la contraseña">
                    </div>

                    <div class="col-md-6">
                        <div class="form-check mt-4 pt-1">
                            <input class="form-check-input" type="checkbox" id="is_active" name="is_active" checked>
                            <label class="form-check-label" for="is_active">
                                Activo
                            </label>
                        </div>
                    </div>

                    <div class="col-12">
                        <button type="submit" class="btn btn-primary">Crear Usuario</button>
                        <a href="{{ url_for('usuarios.listar') }}" class="btn btn-secondary ms-2">Cancelar</a>
                    </div>
                </div>
            </form>
        </div>
    </div>

</div>
{% endblock %}
