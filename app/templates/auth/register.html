{% extends "auth/base_auth.html" %}

{% block content %}

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h3 class="mb-0">

                        Registrar Usuario

                    </h3>

                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">

                            <label>Nombre</label>

                            <input
                                type="text"
                                name="nombre"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label>Email</label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label>Contraseña</label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label>Rol</label>

                            <select
                                name="rol"
                                class="form-select">

                                <option value="admin">
                                    Administrador
                                </option>

                                <option value="auxiliar">
                                    Auxiliar
                                </option>

                            </select>

                        </div>

                        <button
                            class="btn btn-success w-100">

                            Registrar

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
