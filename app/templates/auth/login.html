{% extends 'base.html' %}

{% block content %}

<div class="container">

    <div class="row justify-content-center align-items-center vh-100">

        <div class="col-md-8">

            <div
                class="card shadow-lg border-0"
                style="
                    border-radius: 20px;
                    overflow: hidden;
                "
            >

                <div class="row g-0">

                    <!-- PANEL IZQUIERDO -->

                    <div class="col-md-5">

                        <div
                            style="
                                background:
                                linear-gradient(
                                    180deg,
                                    #0d6efd,
                                    #084298
                                );

                                height: 100%;

                                min-height: 500px;

                                display:flex;

                                flex-direction:column;

                                justify-content:center;

                                align-items:center;

                                color:white;

                                padding:40px;
                            "
                        >

                            <!-- LOGO -->

                            <img
                                src="{{ url_for('static', filename='img/univalle.png') }}"
                                style="
                                    width:140px;
                                    margin-bottom:25px;
                                "
                            >

                            <!-- TÍTULOS -->

                            <h1
                                class="fw-bold text-center"
                                style="
                                    font-size:48px;
                                    line-height:1.1;
                                "
                            >

                                Universidad
                                del Valle

                            </h1>

                            <h3
                                class="text-center mt-3"
                                style="
                                    font-weight:300;
                                "
                            >

                                Sección de Salud
                                Ocupacional

                            </h3>

                            <p
                                class="text-center mt-4"
                                style="
                                    font-size:18px;
                                "
                            >

                                Sistema de Gestión
                                de Empleados y
                                Exámenes Ocupacionales

                            </p>

                        </div>

                    </div>


                    <!-- LOGIN -->

                    <div class="col-md-7">

                        <div class="card-body p-5">

                            <div class="text-center mb-4">

                                <h2 class="fw-bold">

                                    Iniciar Sesión

                                </h2>

                                <p class="text-muted">

                                    Sistema Salud Ocupacional

                                </p>

                            </div>

                            <form method="POST">

                                <!-- EMAIL -->

                                <div class="mb-3">

                                    <label class="form-label">

                                        Email

                                    </label>

                                    <input
                                        type="email"
                                        name="email"
                                        class="form-control"
                                        required
                                    >

                                </div>


                                <!-- PASSWORD -->

                                <div class="mb-3">

                                    <label class="form-label">

                                        Contraseña

                                    </label>

                                    <input
                                        type="password"
                                        name="password"
                                        class="form-control"
                                        required
                                    >

                                </div>


                                <!-- RECUPERAR -->

                                <div class="text-end mb-4">

                                    <a
                                        href="/auth/recuperar-password"
                                        class="text-decoration-none"
                                    >

                                        ¿Olvidaste tu contraseña?

                                    </a>

                                </div>


                                <!-- BOTÓN -->

                                <button
                                    class="btn btn-primary w-100"
                                >

                                    Ingresar

                                </button>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
