{% extends "auth/base_auth.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0 p-5">
                <h1 class="fw-bold">Restablecer contraseña</h1>

        </div>
    </div>
</div>
{% endblock %}
