<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema Salud Ocupacional</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body{

            background:#f4f6f9;

            margin:0;

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            font-family:Arial, Helvetica, sans-serif;

        }

    </style>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/institucional.css') }}">

</head>

<body class="auth-shell">

    <main class="auth-main">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="container auth-alert">
            <div class="alert alert-{{ 'danger' if category == 'error' else category }}" role="alert">{{ message }}</div>
        </div>
        {% endfor %}
    {% endwith %}
    {% block content %}
    {% endblock %}
    </main>

</body>

</html>
