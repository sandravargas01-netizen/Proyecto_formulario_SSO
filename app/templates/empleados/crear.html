{% extends 'base.html' %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Registrar Empleado</h2>

    <a href="{{ url_for('empleado.listar') }}"
       class="btn btn-secondary">
        Volver
    </a>
</div>

<div class="card shadow-sm">

    <div class="card-body">

        <form method="POST">

            <!-- ===================== -->
            <!-- INFORMACIÓN PERSONAL -->
            <!-- ===================== -->

            <h5 class="mb-3 text-primary">
                Información Personal
            </h5>

            <div class="row">

                <div class="col-md-3 mb-3">
                    <label class="form-label">Cédula *</label>

                    <input
                        type="text"
                        name="cedula"
                        class="form-control"
                        required>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Nombres *</label>

                    <input
                        type="text"
                        name="nombres"
                        class="form-control"
                        required>
                </div>

                <div class="col-md-5 mb-3">
                    <label class="form-label">Apellidos *</label>

                    <input
                        type="text"
                        name="apellidos"
                        class="form-control"
                        required>
                </div>

            </div>


            <div class="row">

                <div class="col-md-3 mb-3">
                    <label class="form-label">
                        Fecha Nacimiento
                    </label>

                    <input
                        type="date"
                        name="fecha_nacimiento"
                        class="form-control">
                </div>

                <div class="col-md-3 mb-3">

                    <label class="form-label">
                        Sexo
                    </label>

                    <select
                        name="sexo"
                        class="form-select">

                        <option value="">
                            Seleccione
                        </option>

                        <option value="M">
                            Masculino
                        </option>

                        <option value="F">
                            Femenino
                        </option>

                    </select>

                </div>

                <div class="col-md-3 mb-3">

                    <label class="form-label">
                        Teléfono
                    </label>

                    <input
                        type="text"
                        name="telefono"
                        class="form-control">

                </div>

                <div class="col-md-3 mb-3">

                    <label class="form-label">
                        Correo
                    </label>

                    <input
                        type="email"
                        name="correo"
                        class="form-control">

                </div>

            </div>

            <hr>

            <!-- ===================== -->
            <!-- INFORMACIÓN LABORAL -->
            <!-- ===================== -->

            <h5 class="mb-3 text-primary">
                Información Laboral
            </h5>

            <div class="row">

                <div class="col-md-3 mb-3">

                    <label class="form-label">
                        Fecha Ingreso
                    </label>

                    <input
                        type="date"
                        name="fecha_ingreso"
                        class="form-control">

                </div>

                <div class="col-md-3 mb-3">

                    <label class="form-label">
                        Fecha Retiro
                    </label>

                    <input
                        type="date"
                        name="fecha_retiro"
                        class="form-control">

                </div>

                <div class="col-md-3 mb-3">

                    <label class="form-label">
                        Estado
                    </label>

                    <select
                        name="estado"
                        class="form-select">

                        <option value="Activo">
                            Activo
                        </option>

                        <option value="Retirado">
                            Retirado
                        </option>

                    </select>

                </div>

            </div>

            <div class="row">

                <div class="col-md-4 mb-3">

                    <label class="form-label">
                        Cargo
                    </label>

                    <select
                        name="id_cargo"
                        class="form-select">

                        {% for cargo in cargos %}
                        <option value="{{ cargo.id_cargo }}">
                            {{ cargo.nombre }}
                        </option>
                        {% endfor %}

                    </select>

                </div>

                <div class="col-md-4 mb-3">

                    <label class="form-label">
                        Dependencia
                    </label>

                    <select
                        name="id_dependencia"
                        class="form-select">

                        {% for dependencia in dependencias %}
                        <option value="{{ dependencia.id_dependencia }}">
                            {{ dependencia.nombre }}
                        </option>
                        {% endfor %}

                    </select>

                </div>

                <div class="col-md-4 mb-3">

                    <label class="form-label">
                        Centro de Costo
                    </label>

                    <select
                        name="id_centro_costo"
                        class="form-select">

                        {% for centro in centros %}
                        <option value="{{ centro.id_centro_costo }}">
                            {{ centro.nombre }}
                        </option>
                        {% endfor %}

                    </select>

                </div>

            </div>

            <div class="row">

                <div class="col-md-4 mb-3">

                    <label class="form-label">
                        Vinculación
                    </label>

                    <select
                        name="id_vinculacion"
                        class="form-select">

                        {% for vinculacion in vinculaciones %}
                        <option value="{{ vinculacion.id_vinculacion }}">
                            {{ vinculacion.nombre }}
                        </option>
                        {% endfor %}

                    </select>

                </div>

                <div class="col-md-4 mb-3">

                    <label class="form-label">
                        Estamento
                    </label>

                    <select
                        name="id_estamento"
                        class="form-select">

                        {% for estamento in estamentos %}
                        <option value="{{ estamento.id_estamento }}">
                            {{ estamento.nombre }}
                        </option>
                        {% endfor %}

                    </select>

                </div>

            </div>

            <hr>

            <!-- ===================== -->
            <!-- SEGURIDAD SOCIAL -->
            <!-- ===================== -->

            <h5 class="mb-3 text-primary">
                Seguridad Social
            </h5>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        EPS
                    </label>

                    <select
                        name="id_eps"
                        class="form-select">

                        {% for e in eps %}
                        <option value="{{ e.id_eps }}">
                            {{ e.nombre }}
                        </option>
                        {% endfor %}

                    </select>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        AFP
                    </label>

                    <select
                        name="id_afp"
                        class="form-select">

                        {% for a in afps %}
                        <option value="{{ a.id_afp }}">
                            {{ a.nombre }}
                        </option>
                        {% endfor %}

                    </select>

                </div>

            </div>

            <button
                class="btn btn-primary">

                Guardar Empleado

            </button>

        </form>

    </div>

</div>

{% endblock %}
